telegram_bot_token: "your-telegram-bot-token"
# OpenAI-compatible endpoint. Default host is AITunnel.
base_url: "https://api.aitunnel.ru/v1/"
api_key: "your-api-key"
# Speech → text.
stt_model: "voxtral-small-24b-2507-stt"
# Transcript → note.
model_name: "deepseek-v4-flash"

# Persist whitelist DB in the Docker volume.
database_path: "/app/data/notesbro.sqlite3"

# Fallback UI language: en, ru, uk, it, fr, de, es.
# Users can override it with /set_locale; notes follow the voice language.
default_locale: "en"

# When false, only users already present in the users table may use the bot.
allow_new_users: true

