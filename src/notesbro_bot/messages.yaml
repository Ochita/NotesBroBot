en:
  access_closed: |-
    This bot is not accepting new users. Only existing users may use it.
  start: |-
    Send a voice message. I will transcribe it and reply with summarized
    notes: a note title, a list heading, and bullet points.

    To extend a note: reply /add to the note message you want to update,
    then send your next voice message within two minutes. /cancel clears an
    armed /add. (No message ids are stored.)
  help: |-
    Commands:
    /start - subscribe and get usage help
    /add - reply to a note, then send a voice message to merge into it
    /cancel - cancel an armed /add
    /edit - reply to a note, then send `2 new text` to fix one line
    /set_locale <code> - set your language

    Notes are written in the language of your voice message.
  add_need_reply: Reply /add to the note message you want to update.
  add_not_a_note: |-
    I couldn't parse that replied message as a note. Reply /add to a note
    message previously sent by this bot.
  add_armed: |-
    OK. Send 1 voice within {ttl}s to merge. Use /cancel to stop.
  edit_need_reply: Reply /edit to the note message you want to fix.
  edit_not_a_note: |-
    I couldn't parse that replied message as a note. Reply /edit to a note
    message previously sent by this bot.
  edit_prompt: |-
    Best: reply to the note with a quote of the line you want to fix and
    send just the new text for it.

    Or tap an item number below, or send the lines to fix one per line:
    2 new text - replace item 2
    -2 - delete item 2
    + some text - add a new item
    t new title - replace the note title
    l new heading - replace the list heading

    /cancel to stop.
  edit_done: "Note updated. Lines changed: {count}"
  edit_nothing: |-
    No valid edits found. Example: `2 corrected text`, `-1`, `+ new item`.
  edit_same: Note already looks like that; nothing to change.
  edit_selected: |-
    Item {number} selected. Send the new text for it.
    Current: {current}
  edit_expired: This edit session expired. Send /edit again.
  edit_cancelled: Edit cancelled.
  cancel_done: Cancelled merge mode.
  cancel_nothing: Nothing to cancel.
  status_transcribing: Transcribing…
  status_transcribing_addon: Transcribing add-on…
  status_summarizing: Summarizing into notes…
  status_merging: Merging into your note…
  err_download: "Could not download the voice file: {error}"
  err_transcribe: "Transcription failed: {error}"
  err_notes: "Could not build notes: {error}"
  err_format: "(Could not send formatted notes: {error})\n\n{transcript}"
  no_speech: "(No speech recognized; try again or speak closer.)"
  set_locale_missing: |-
    Provide a language code, for example:
    /set_locale en
  set_locale_invalid: "Unknown language. Use en, ru, uk, it, fr, de, or es."
  set_locale_saved: "Language saved: {code}"
  note_untitled: Untitled note
  note_summary_heading: Summary
  note_no_items: (No distinct points extracted from the transcript.)

ru:
  access_closed: |-
    Бот не принимает новых пользователей. Доступ только у уже зарегистрированных.
  start: |-
    Отправьте голосовое сообщение. Я расшифрую его и отвечу
    структурированной заметкой: заголовок, подзаголовок списка и пункты.

    Чтобы дополнить заметку: ответьте /add на сообщение с заметкой
    и отправьте следующее голосовое в течение двух минут. /cancel снимает
    режим /add. (Идентификаторы сообщений не сохраняются.)
  help: |-
    Команды:
    /start - подписаться и получить справку
    /add - ответьте на заметку, затем отправьте голосовое для дополнения
    /cancel - отменить подготовленный /add
    /edit - ответьте на заметку и пришлите `2 новый текст`, чтобы исправить строку
    /set_locale <код> - установить язык

    Заметки пишутся на языке вашего голосового сообщения.
  add_need_reply: Ответьте /add на сообщение с заметкой, которую хотите дополнить.
  add_not_a_note: |-
    Не удалось распознать в этом сообщении заметку. Ответьте /add на
    сообщение с заметкой, которое отправлял этот бот.
  add_armed: |-
    ОК. Отправьте 1 голосовое в течение {ttl} с для дополнения.
    /cancel - отменить.
  edit_need_reply: Ответьте /edit на сообщение с заметкой, которую хотите исправить.
  edit_not_a_note: |-
    Не удалось распознать в этом сообщении заметку. Ответьте /edit на
    сообщение с заметкой, которое отправлял этот бот.
  edit_prompt: |-
    Лучше всего: ответьте на заметку, выделив нужную строку, и пришлите
    только новый текст для неё.

    Или нажмите номер пункта ниже, или пришлите строки для правки:
    Меняется только та строка, которую вы указали:
    2 новый текст - заменить пункт 2
    -2 - удалить пункт 2
    + новый пункт - добавить пункт
    t новый заголовок - заменить заголовок заметки
    l новый подзаголовок - заменить подзаголовок списка

    /cancel - отменить.
  edit_done: "Заметка обновлена. Изменено строк: {count}"
  edit_nothing: |-
    Не нашел корректных правок. Пример: `2 исправленный текст`, `-1`,
    `+ новый пункт`.
  edit_same: В заметке уже так и написано, менять нечего.
  edit_selected: |-
    Выбран пункт {number}. Пришлите новый текст для него.
    Сейчас: {current}
  edit_expired: Сессия правки истекла. Отправьте /edit заново.
  edit_cancelled: Правка отменена.
  cancel_done: Режим дополнения отменен.
  cancel_nothing: Нечего отменять.
  status_transcribing: Расшифровываю…
  status_transcribing_addon: Расшифровываю дополнение…
  status_summarizing: Собираю заметку…
  status_merging: Дополняю заметку…
  err_download: "Не удалось скачать голосовой файл: {error}"
  err_transcribe: "Не удалось расшифровать: {error}"
  err_notes: "Не удалось собрать заметку: {error}"
  err_format: "(Не удалось отправить оформленную заметку: {error})\n\n{transcript}"
  no_speech: "(Речь не распознана; попробуйте ещё раз или говорите ближе.)"
  set_locale_missing: |-
    Укажите код языка, например:
    /set_locale ru
  set_locale_invalid: "Неизвестный язык. Доступны en, ru, uk, it, fr, de, es."
  set_locale_saved: "Язык сохранен: {code}"
  note_untitled: Заметка без названия
  note_summary_heading: Итоги
  note_no_items: (Из расшифровки не удалось выделить отдельные пункты.)

uk:
  access_closed: |-
    Бот не приймає нових користувачів. Доступ лише для вже зареєстрованих.
  start: |-
    Надішліть голосове повідомлення. Я розшифрую його й відповім
    структурованою нотаткою: заголовок, підзаголовок списку та пункти.

    Щоб доповнити нотатку: дайте відповідь /add на повідомлення з нотаткою
    й надішліть наступне голосове протягом двох хвилин. /cancel скасовує
    режим /add. (Ідентифікатори повідомлень не зберігаються.)
  help: |-
    Команди:
    /start - підписатися та отримати довідку
    /add - відповідайте на нотатку, потім надішліть голосове для доповнення
    /cancel - скасувати підготовлений /add
    /edit - дайте відповідь на нотатку й надішліть `2 новий текст`, щоб виправити рядок
    /set_locale <код> - встановити мову

    Нотатки пишуться мовою вашого голосового повідомлення.
  add_need_reply: Дайте відповідь /add на повідомлення з нотаткою, яку хочете доповнити.
  add_not_a_note: |-
    Не вдалося розпізнати в цьому повідомленні нотатку. Дайте відповідь
    /add на повідомлення з нотаткою, яке надсилав цей бот.
  add_armed: |-
    Гаразд. Надішліть 1 голосове протягом {ttl} с для доповнення.
    /cancel - скасувати.
  edit_need_reply: Дайте відповідь /edit на повідомлення з нотаткою, яку хочете виправити.
  edit_not_a_note: |-
    Не вдалося розпізнати в цьому повідомленні нотатку. Дайте відповідь
    /edit на повідомлення з нотаткою, яке надсилав цей бот.
  edit_prompt: |-
    Найкраще: дайте відповідь на нотатку, виділивши потрібний рядок, і
    надішліть лише новий текст для нього.

    Або натисніть номер пункту нижче, або надішліть рядки для правки:
    Змінюється лише той рядок, який ви вказали:
    2 новий текст - замінити пункт 2
    -2 - видалити пункт 2
    + новий пункт - додати пункт
    t новий заголовок - замінити заголовок нотатки
    l новий підзаголовок - замінити підзаголовок списку

    /cancel - скасувати.
  edit_done: "Нотатку оновлено. Змінено рядків: {count}"
  edit_nothing: |-
    Не знайшов коректних правок. Приклад: `2 виправлений текст`, `-1`,
    `+ новий пункт`.
  edit_same: У нотатці вже так написано, змінювати нічого.
  edit_selected: |-
    Вибрано пункт {number}. Надішліть новий текст для нього.
    Зараз: {current}
  edit_expired: Сесія правки минула. Надішліть /edit знову.
  edit_cancelled: Правку скасовано.
  cancel_done: Режим доповнення скасовано.
  cancel_nothing: Немає що скасовувати.
