it:
  need_reply: Rispondi al messaggio della nota che vuoi modificare.
  not_a_note: |-
    Non riesco a interpretare quel messaggio come una nota. Rispondi a un
    messaggio di nota inviato da questo bot.
  add_armed: |-
    OK. Invia 1 vocale entro {ttl}s per aggiungere il punto. /cancel per fermarti.
  edit_armed: |-
    OK. Invia 1 vocale entro {ttl}s e il testo citato verrà sostituito.
    /cancel per fermarti.
  note_updated: Nota aggiornata.
  note_update_failed: Impossibile aggiornare il messaggio della nota. Riprova.
  access_closed: |-
    Il bot non accetta nuovi utenti. Solo gli utenti già registrati possono usarlo.
  start: |-
    Invia un messaggio vocale. Lo trascriverò e risponderò con una nota
    strutturata: titolo, intestazione dell'elenco e punti.

    Non riscrivere mai tutta la nota:
    /add testo - rispondi a una nota per aggiungere un punto
    /edit testo - rispondi citando il testo da sostituire: cambia solo quello

    Senza testo entrambe attendono 60s un vocale. /cancel lo annulla.
    /help per tutti i comandi.

  help: |-
    Comandi:
    /start - attiva l'iscrizione e mostra la guida
    /help - tutti i comandi
    /set_locale <codice> - lingua: en, ru, uk, it, fr, de, es

    Note:
    /add <testo>  - rispondi a una nota; più punti vengono separati
    /add          - rispondi a una nota, poi invia un vocale da aggiungere
    /edit <testo> - rispondi citando il frammento da sostituire
    /edit         - rispondi citandolo, poi invia un vocale che lo sostituisca
    /cancel       - smetti di attendere il vocale

    Le note sono scritte nella lingua dell'interfaccia (/set_locale).
  edit_need_quote: |-
    Prima seleziona il testo da sostituire: rispondi alla nota, cita il
    frammento, poi invia /edit <nuovo testo>.
  edit_quote_miss: |-
    Non trovo "{quoted}" nella nota. Cita il testo esatto da sostituire.
  add_full: "La lista è piena ({count} punti). Eliminane uno prima."
  cancel_done: Modalità unione annullata.
  cancel_nothing: Niente da annullare.
  status_transcribing: Trascrivo…
  status_transcribing_addon: Trascrivo l'aggiunta…
  status_summarizing: Preparo la nota…
  status_merging: Unisco alla nota…
  err_download: "Impossibile scaricare il file vocale: {error}"
  err_transcribe: "Trascrizione non riuscita: {error}"
  err_notes: "Impossibile creare la nota: {error}"
  err_format: "(Impossibile inviare la nota formattata: {error})\n\n{transcript}"
  no_speech: "(Nessuna voce riconosciuta; riprova o parla più vicino.)"
  set_locale_missing: |-
    Indica il codice della lingua, per esempio:
    /set_locale it
  set_locale_invalid: "Lingua sconosciuta. Usa en, ru, uk, it, fr, de o es."
  set_locale_saved: "Lingua salvata: {code}"
  note_untitled: Nota senza titolo
  note_summary_heading: Riepilogo
  note_no_items: (Nessun punto distinto estratto dalla trascrizione.)

fr:
  need_reply: Répondez au message de la note à modifier.
  not_a_note: |-
    Je n'ai pas pu interpréter ce message comme une note. Répondez à un
    message de note envoyé par ce bot.
  add_armed: |-
    OK. Envoyez 1 vocal dans les {ttl}s pour ajouter le point.
    /cancel pour arrêter.
  edit_armed: |-
    OK. Envoyez 1 vocal dans les {ttl}s : le texte cité sera remplacé.
    /cancel pour arrêter.
  note_updated: Note mise à jour.
  note_update_failed: Impossible de mettre à jour la note. Réessayez.
  access_closed: |-
    Ce bot n'accepte pas de nouveaux utilisateurs. Seuls les utilisateurs existants peuvent l'utiliser.
  start: |-
    Envoyez un message vocal. Je le transcrirai et répondrai avec une note
    structurée : titre, en-tête de liste et points.

    Ne retapez jamais toute la note :
    /add texte - répondez à une note pour ajouter un point
    /edit texte - répondez en citant le texte à remplacer : lui seul change

    Sans texte, les deux attendent 60s un vocal. /cancel l'annule.
    /help pour toutes les commandes.

  help: |-
    Commandes :
    /start - s'abonner et afficher l'aide
    /help - toutes les commandes
    /set_locale <code> - langue : en, ru, uk, it, fr, de, es

    Notes :
    /add <texte>  - répondez à une note ; plusieurs points sont séparés
    /add          - répondez à une note puis envoyez un vocal à ajouter
    /edit <texte> - répondez en citant le fragment à remplacer
    /edit         - répondez en le citant, puis envoyez un vocal
    /cancel       - arrêter d'attendre le vocal

    Les notes sont rédigées dans la langue de l'interface (/set_locale).
  edit_need_quote: |-
    Sélectionnez d'abord le texte à remplacer : répondez à la note, citez
    le fragment, puis envoyez /edit <nouveau texte>.
  edit_quote_miss: |-
    Je ne trouve pas « {quoted} » dans la note. Citez le texte exact.
  add_full: "La liste est pleine ({count} points). Supprimez-en un."
  cancel_done: Mode fusion annulé.
  cancel_nothing: Rien à annuler.
  status_transcribing: Transcription…
  status_transcribing_addon: Transcription de l'ajout…
  status_summarizing: Préparation de la note…
  status_merging: Fusion dans votre note…
  err_download: "Impossible de télécharger le fichier vocal : {error}"
  err_transcribe: "Échec de la transcription : {error}"
  err_notes: "Impossible de créer la note : {error}"
  err_format: "(Impossible d'envoyer la note formatée : {error})\n\n{transcript}"
  no_speech: "(Aucune parole reconnue ; réessayez ou parlez plus près.)"
  set_locale_missing: |-
    Indiquez un code de langue, par exemple :
    /set_locale fr
  set_locale_invalid: "Langue inconnue. Utilisez en, ru, uk, it, fr, de ou es."
  set_locale_saved: "Langue enregistrée : {code}"
  note_untitled: Note sans titre
  note_summary_heading: Résumé
  note_no_items: (Aucun point distinct extrait de la transcription.)

de:
  need_reply: Antworte auf die Notiznachricht, die du ändern willst.
  not_a_note: |-
    Ich konnte diese Nachricht nicht als Notiz lesen. Antworte auf eine
    Notiznachricht, die dieser Bot gesendet hat.
  add_armed: |-
    OK. Sende 1 Sprachnachricht innerhalb von {ttl}s, um den Punkt
    anzuhängen. /cancel zum Abbrechen.
  edit_armed: |-
    OK. Sende 1 Sprachnachricht innerhalb von {ttl}s: der zitierte Text wird
    ersetzt. /cancel zum Abbrechen.
  note_updated: Notiz aktualisiert.
  note_update_failed: Notiznachricht konnte nicht aktualisiert werden.
  access_closed: |-
    Dieser Bot nimmt keine neuen Nutzer an. Nur bestehende Nutzer können ihn verwenden.
  start: |-
    Sende eine Sprachnachricht. Ich transkribiere sie und antworte mit einer
    strukturierten Notiz: Titel, Listenüberschrift und Stichpunkten.

    Tippe die Notiz nie komplett neu:
    /add Text - auf eine Notiz antworten, um einen Punkt anzuhängen
    /edit Text - antworten und den zu ersetzenden Text zitieren

    Ohne Text warten beide 60s auf eine Sprachnachricht. /cancel bricht ab.
    /help zeigt alle Befehle.

  help: |-
    Befehle:
    /start - Abonnement und Hilfe
    /help - alle Befehle
    /set_locale <Code> - Sprache: en, ru, uk, it, fr, de, es

    Notizen:
    /add <Text>  - auf eine Notiz antworten; mehrere Punkte werden geteilt
    /add         - auf eine Notiz antworten, dann Sprachnachricht senden
    /edit <Text> - antworten und den Ausschnitt zum Ersetzen zitieren
    /edit        - zitieren, dann Sprachnachricht zum Ersetzen senden
    /cancel      - nicht mehr auf die Sprachnachricht warten

    Notizen werden in der Sprache der Oberfläche verfasst (/set_locale).
  edit_need_quote: |-
    Markiere zuerst den zu ersetzenden Text: antworte auf die Notiz,
    zitiere den Ausschnitt, dann sende /edit <neuer Text>.
  edit_quote_miss: |-
    "{quoted}" wurde in der Notiz nicht gefunden. Zitiere den exakten Text.
  add_full: "Die Liste ist voll ({count} Punkte). Lösche zuerst einen."
  cancel_done: Ergänzungsmodus abgebrochen.
  cancel_nothing: Nichts abzubrechen.
  status_transcribing: Transkribiere…
  status_transcribing_addon: Transkribiere Ergänzung…
  status_summarizing: Erstelle Notiz…
  status_merging: Ergänze Notiz…
  err_download: "Sprachdatei konnte nicht geladen werden: {error}"
  err_transcribe: "Transkription fehlgeschlagen: {error}"
  err_notes: "Notiz konnte nicht erstellt werden: {error}"
  err_format: "(Formatierte Notiz konnte nicht gesendet werden: {error})\n\n{transcript}"
  no_speech: "(Keine Sprache erkannt; versuche es erneut oder sprich näher.)"
  set_locale_missing: |-
    Gib einen Sprachcode an, zum Beispiel:
    /set_locale de
  set_locale_invalid: "Unbekannte Sprache. Nutze en, ru, uk, it, fr, de oder es."
  set_locale_saved: "Sprache gespeichert: {code}"
  note_untitled: Notiz ohne Titel
  note_summary_heading: Zusammenfassung
  note_no_items: (Keine eigenständigen Punkte aus der Transkription erkannt.)

es:
  need_reply: Responde al mensaje de la nota que quieres cambiar.
  not_a_note: |-
    No pude interpretar ese mensaje como una nota. Responde a un mensaje de
    nota enviado por este bot.
  add_armed: |-
    OK. Envía 1 audio en {ttl}s para añadir el punto. /cancel para parar.
  edit_armed: |-
    OK. Envía 1 audio en {ttl}s y el texto citado se reemplazará.
    /cancel para parar.
  note_updated: Nota actualizada.
  note_update_failed: No se pudo actualizar el mensaje de la nota.
  access_closed: |-
    Este bot no acepta usuarios nuevos. Solo pueden usarlo usuarios ya registrados.
  start: |-
    Envía un mensaje de voz. Lo transcribiré y responderé con una nota
    estructurada: título, encabezado de la lista y puntos.

    Para ampliar una nota: responde /add al mensaje de la nota y envía el
    siguiente audio en menos de dos minutos. /cancel anula el modo /add.
    (No se guardan ids de mensajes.)
  help: |-
    Comandos:
    /start - suscribirse y ver la ayuda
    /add <texto> - responde a una nota; varios puntos se separan
    /add solo - responde y envía un audio para unirlo
    /cancel - cancelar un /add preparado
    /edit <texto> - responde a una nota, cita un fragmento, reemplázalo
    /set_locale <código> - configurar el idioma

    Las notas se escriben en el idioma de la interfaz (/set_locale).
  edit_need_quote: |-
    Primero selecciona el texto a reemplazar: responde a la nota, cita el
    fragmento y envía /edit <texto nuevo>.
  edit_quote_miss: |-
    No encuentro "{quoted}" en la nota. Cita el texto exacto a reemplazar.
  add_full: "La lista está llena ({count} puntos). Elimina uno primero."
  cancel_done: Modo de unión cancelado.
  cancel_nothing: Nada que cancelar.
  status_transcribing: Transcribiendo…
  status_transcribing_addon: Transcribiendo el añadido…
  status_summarizing: Preparando la nota…
  status_merging: Uniendo a tu nota…
  err_download: "No se pudo descargar el archivo de voz: {error}"
  err_transcribe: "Falló la transcripción: {error}"
  err_notes: "No se pudo crear la nota: {error}"
  err_format: "(No se pudo enviar la nota formateada: {error})\n\n{transcript}"
  no_speech: "(No se reconoció voz; inténtalo otra vez o habla más cerca.)"
  set_locale_missing: |-
    Indica un código de idioma, por ejemplo:
    /set_locale es
  set_locale_invalid: "Idioma desconocido. Usa en, ru, uk, it, fr, de o es."
  set_locale_saved: "Idioma guardado: {code}"
  note_untitled: Nota sin título
  note_summary_heading: Resumen
  note_no_items: (No se extrajeron puntos distintos de la transcripción.)
