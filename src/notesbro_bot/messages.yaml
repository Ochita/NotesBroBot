de:
  access_closed: |-
    Dieser Bot nimmt keine neuen Nutzer an. Nur bestehende Nutzer können ihn verwenden.
  start: |-
    Sende eine Sprachnachricht. Ich transkribiere sie und antworte mit einer
    strukturierten Notiz: Titel, Listenüberschrift und Stichpunkten.

    Zum Ergänzen einer Notiz: antworte mit /add auf die Notiznachricht und
    sende die nächste Sprachnachricht innerhalb von zwei Minuten. /cancel
    hebt ein vorbereitetes /add auf. (Es werden keine Message-IDs gespeichert.)
  help: |-
    Befehle:
    /start - Abonnement und Hilfe
    /add - auf eine Notiz antworten, dann Sprachnachricht zum Ergänzen senden
    /cancel - vorbereitetes /add abbrechen
    /edit - auf eine Notiz antworten, dann `2 neuer Text` zum Korrigieren senden
    /set_locale <Code> - Sprache festlegen

    Notizen werden in der Sprache deiner Sprachnachricht verfasst.
  add_need_reply: Antworte mit /add auf die Notiznachricht, die du ändern willst.
  add_not_a_note: |-
    Ich konnte diese Nachricht nicht als Notiz lesen. Antworte mit /add auf
    eine Notiznachricht, die dieser Bot gesendet hat.
  add_armed: |-
    OK. Sende 1 Sprachnachricht innerhalb von {ttl}s zum Ergänzen.
    /cancel zum Abbrechen.
  edit_need_reply: Antworte mit /edit auf die Notiznachricht, die du ändern willst.
  edit_not_a_note: |-
    Ich konnte diese Nachricht nicht als Notiz lesen. Antworte mit /edit auf
    eine Notiznachricht, die dieser Bot gesendet hat.
  edit_prompt: |-
    Am besten: antworte auf die Notiz mit einem Zitat der Zeile und sende
    nur den neuen Text dafür.

    Oder tippe auf eine Punktnummer oder sende die Zeilen einzeln:
    Nur die genannte Zeile ändert sich:
    2 neuer Text - Punkt 2 ersetzen
    -2 - Punkt 2 löschen
    + neuer Punkt - Punkt hinzufügen
    t neuer Titel - Titel der Notiz ersetzen
    l neue Überschrift - Listenüberschrift ersetzen

    /cancel zum Abbrechen.
  edit_done: "Notiz aktualisiert. Geänderte Zeilen: {count}"
  edit_nothing: |-
    Keine gültigen Änderungen gefunden. Beispiel: `2 korrigierter Text`,
    `-1`, `+ neuer Punkt`.
  edit_same: Die Notiz sieht schon so aus, nichts zu ändern.
  edit_selected: |-
    Punkt {number} gewählt. Sende den neuen Text.
    Aktuell: {current}
  edit_expired: Sitzung abgelaufen. Sende /edit erneut.
  edit_cancelled: Änderung abgebrochen.
  cancel_done: Ergänzungsmodus abgebrochen.
  cancel_nothing: Nichts abzubrechen.
  status_transcribing: Transkribiere…
  status_transcribing_addon: Transkribiere Ergänzung…
  status_summarizing: Erstelle Notiz…
  status_merging: Ergänze Notiz…
  err_download: "Sprachdatei konnte nicht geladen werden: {error}"
  err_transcribe: "Transkription fehlgeschlagen: {error}"
  err_notes: "Notiz konnte nicht erstellt werden: {error}"
  err_format: "(Formatierte Notiz konnte nicht gesendet werden: {error})\n\n{transcript}"
  no_speech: "(Keine Sprache erkannt; versuche es erneut oder sprich näher.)"
  set_locale_missing: |-
    Gib einen Sprachcode an, zum Beispiel:
    /set_locale de
  set_locale_invalid: "Unbekannte Sprache. Nutze en, ru, uk, it, fr, de oder es."
  set_locale_saved: "Sprache gespeichert: {code}"
  note_untitled: Notiz ohne Titel
  note_summary_heading: Zusammenfassung
  note_no_items: (Keine eigenständigen Punkte aus der Transkription erkannt.)

es:
  access_closed: |-
    Este bot no acepta usuarios nuevos. Solo pueden usarlo usuarios ya registrados.
  start: |-
    Envía un mensaje de voz. Lo transcribiré y responderé con una nota
    estructurada: título, encabezado de la lista y puntos.

    Para ampliar una nota: responde /add al mensaje de la nota y envía el
    siguiente audio en menos de dos minutos. /cancel anula el modo /add.
    (No se guardan ids de mensajes.)
  help: |-
    Comandos:
    /start - suscribirse y ver la ayuda
    /add - responder a una nota y enviar un audio para unirlo
    /cancel - cancelar un /add preparado
    /edit - responde a una nota y envía `2 texto nuevo` para corregir una línea
    /set_locale <código> - configurar el idioma

    Las notas se escriben en el idioma de tu mensaje de voz.
  add_need_reply: Responde /add al mensaje de la nota que quieres actualizar.
  add_not_a_note: |-
    No pude interpretar ese mensaje como una nota. Responde /add a un
    mensaje de nota enviado por este bot.
  add_armed: |-
    OK. Envía 1 audio en {ttl}s para unirlo. Usa /cancel para parar.
  edit_need_reply: Responde /edit al mensaje de la nota que quieres corregir.
  edit_not_a_note: |-
    No pude interpretar ese mensaje como una nota. Responde /edit a un
    mensaje de nota enviado por este bot.
  edit_prompt: |-
    Mejor: responde a la nota citando la línea a corregir y envía solo el
    texto nuevo.

    O toca el número de un punto, o envía las líneas a corregir:
    Solo cambia la línea que indiques:
    2 texto nuevo - reemplazar el punto 2
    -2 - eliminar el punto 2
    + nuevo punto - añadir un punto
    t nuevo título - reemplazar el título de la nota
    l nuevo encabezado - reemplazar el encabezado de la lista

    /cancel para parar.
  edit_done: "Nota actualizada. Líneas cambiadas: {count}"
  edit_nothing: |-
    No encontré correcciones válidas. Ejemplo: `2 texto corregido`, `-1`,
    `+ nuevo punto`.
  edit_same: La nota ya dice eso, no hay nada que cambiar.
  edit_selected: |-
    Punto {number} seleccionado. Envía el texto nuevo.
    Actual: {current}
  edit_expired: La sesión caducó. Envía /edit otra vez.
  edit_cancelled: Corrección cancelada.
  cancel_done: Modo de unión cancelado.
  cancel_nothing: Nada que cancelar.
  status_transcribing: Transcribiendo…
  status_transcribing_addon: Transcribiendo el añadido…
  status_summarizing: Preparando la nota…
  status_merging: Uniendo a tu nota…
  err_download: "No se pudo descargar el archivo de voz: {error}"
  err_transcribe: "Falló la transcripción: {error}"
  err_notes: "No se pudo crear la nota: {error}"
  err_format: "(No se pudo enviar la nota formateada: {error})\n\n{transcript}"
  no_speech: "(No se reconoció voz; inténtalo otra vez o habla más cerca.)"
  set_locale_missing: |-
    Indica un código de idioma, por ejemplo:
    /set_locale es
  set_locale_invalid: "Idioma desconocido. Usa en, ru, uk, it, fr, de o es."
  set_locale_saved: "Idioma guardado: {code}"
  note_untitled: Nota sin título
  note_summary_heading: Resumen
