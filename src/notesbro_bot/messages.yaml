  status_transcribing_addon: Розшифровую доповнення…
  status_summarizing: Збираю нотатку…
  status_merging: Доповнюю нотатку…
  err_download: "Не вдалося завантажити голосовий файл: {error}"
  err_transcribe: "Не вдалося розшифрувати: {error}"
  err_notes: "Не вдалося зібрати нотатку: {error}"
  err_format: "(Не вдалося надіслати оформлену нотатку: {error})\n\n{transcript}"
  no_speech: "(Мову не розпізнано; спробуйте ще раз або говоріть ближче.)"
  set_locale_missing: |-
    Вкажіть код мови, наприклад:
    /set_locale uk
  set_locale_invalid: "Невідома мова. Доступні en, ru, uk, it, fr, de, es."
