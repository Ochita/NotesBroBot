it:
  access_closed: |-
    Il bot non accetta nuovi utenti. Solo gli utenti già registrati possono usarlo.
  start: |-
    Invia un messaggio vocale. Lo trascriverò e risponderò con una nota
    strutturata: titolo, intestazione dell'elenco e punti.

    Per estendere una nota: rispondi /add al messaggio della nota, poi invia
    il vocale successivo entro due minuti. /cancel annulla la modalità /add.
    (Nessun id dei messaggi viene salvato.)
  help: |-
    Comandi:
    /start - attiva l'iscrizione e mostra la guida
    /add - rispondi a una nota, poi invia un vocale da unire
    /cancel - annulla un /add preparato
    /edit - rispondi a una nota e invia `2 nuovo testo` per correggere una riga
    /set_locale <codice> - imposta la lingua

    Le note sono scritte nella lingua del tuo messaggio vocale.
  add_need_reply: Rispondi /add al messaggio della nota che vuoi aggiornare.
  add_not_a_note: |-
    Non riesco a interpretare quel messaggio come una nota. Rispondi /add
    a un messaggio di nota inviato da questo bot.
  add_armed: |-
    OK. Invia 1 vocale entro {ttl}s per unire. Usa /cancel per fermarti.
  edit_need_reply: Rispondi /edit al messaggio della nota che vuoi correggere.
  edit_not_a_note: |-
    Non riesco a interpretare quel messaggio come una nota. Rispondi /edit
    a un messaggio di nota inviato da questo bot.
  edit_prompt: |-
    Meglio: rispondi alla nota citando la riga da correggere e invia solo
    il nuovo testo.

    Oppure tocca il numero di un punto, o invia le righe da correggere:
    2 nuovo testo - sostituisci il punto 2
    -2 - elimina il punto 2
    + nuovo punto - aggiungi un punto
    t nuovo titolo - sostituisci il titolo della nota
    l nuova intestazione - sostituisci l'intestazione dell'elenco

    /cancel per fermarti.
  edit_done: "Nota aggiornata. Righe modificate: {count}"
  edit_nothing: |-
    Nessuna correzione valida. Esempio: `2 testo corretto`, `-1`,
    `+ nuovo punto`.
  edit_same: La nota è già così, niente da cambiare.
  edit_selected: |-
    Punto {number} selezionato. Invia il nuovo testo.
    Attuale: {current}
  edit_expired: Sessione scaduta. Invia di nuovo /edit.
  edit_cancelled: Correzione annullata.
  cancel_done: Modalità unione annullata.
  cancel_nothing: Niente da annullare.
