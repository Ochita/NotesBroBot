    /cancel - cancelar un /add preparado
    /edit <texto> - responde a una nota, cita un fragmento, reemplázalo
    /set_locale <código> - configurar el idioma

    Las notas se escriben en el idioma de tu mensaje de voz.
  edit_need_quote: |-
    Primero selecciona el texto a reemplazar: responde a la nota, cita el
