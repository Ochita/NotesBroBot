  err_transcribe: "Trascrizione non riuscita: {error}"
  err_notes: "Impossibile creare la nota: {error}"
  err_format: "(Impossibile inviare la nota formattata: {error})\n\n{transcript}"
  no_speech: "(Nessuna voce riconosciuta; riprova o parla più vicino.)"
  set_locale_missing: |-
    Indica il codice della lingua, per esempio:
    /set_locale it
  set_locale_invalid: "Lingua sconosciuta. Usa en, ru, uk, it, fr, de o es."
  set_locale_saved: "Lingua salvata: {code}"
  note_untitled: Nota senza titolo
  note_summary_heading: Riepilogo
  note_no_items: (Nessun punto distinto estratto dalla trascrizione.)

fr:
  access_closed: |-
    Ce bot n'accepte pas de nouveaux utilisateurs. Seuls les utilisateurs existants peuvent l'utiliser.
  start: |-
    Envoyez un message vocal. Je le transcrirai et répondrai avec une note
    structurée : titre, en-tête de liste et points.

    Pour compléter une note : répondez /add au message de la note, puis
    envoyez le vocal suivant dans les deux minutes. /cancel annule le mode
    /add. (Aucun id de message n'est stocké.)
  help: |-
    Commandes :
    /start - s'abonner et afficher l'aide
    /add - répondre à une note, puis envoyer un vocal à fusionner
    /cancel - annuler un /add préparé
    /edit - répondez à une note puis envoyez `2 nouveau texte` pour corriger une ligne
    /set_locale <code> - définir la langue

    Les notes sont rédigées dans la langue de votre message vocal.
  add_need_reply: Répondez /add au message de la note à mettre à jour.
  add_not_a_note: |-
    Je n'ai pas pu interpréter ce message comme une note. Répondez /add
    à un message de note envoyé par ce bot.
  add_armed: |-
    OK. Envoyez 1 vocal dans les {ttl}s pour fusionner. /cancel pour arrêter.
  edit_need_reply: Répondez /edit au message de la note à corriger.
  edit_not_a_note: |-
    Je n'ai pas pu interpréter ce message comme une note. Répondez /edit
    à un message de note envoyé par ce bot.
  edit_prompt: |-
    Le mieux : répondez à la note en citant la ligne à corriger et envoyez
    seulement le nouveau texte.

    Ou touchez un numéro de point, ou envoyez les lignes à corriger :
    Seule la ligne indiquée change :
    2 nouveau texte - remplacer le point 2
    -2 - supprimer le point 2
    + nouveau point - ajouter un point
    t nouveau titre - remplacer le titre de la note
    l nouvel en-tête - remplacer l'en-tête de la liste

    /cancel pour arrêter.
  edit_done: "Note mise à jour. Lignes modifiées : {count}"
  edit_nothing: |-
    Aucune correction valide. Exemple : `2 texte corrigé`, `-1`,
    `+ nouveau point`.
  edit_same: La note est déjà ainsi, rien à changer.
  edit_selected: |-
    Point {number} sélectionné. Envoyez le nouveau texte.
    Actuel : {current}
  edit_expired: Session expirée. Renvoyez /edit.
  edit_cancelled: Correction annulée.
  cancel_done: Mode fusion annulé.
  cancel_nothing: Rien à annuler.
  status_transcribing: Transcription…
  status_transcribing_addon: Transcription de l'ajout…
  status_summarizing: Préparation de la note…
  status_merging: Fusion dans votre note…
